<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Unshiter · statistiques</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body><header><h1 id="site-name">Site Unshiter</h1><p>par <a id="site-author" href="https://tcrouzet.com">Thierry Crouzet</a></p><p id="site-description"></p></header>
<main><aside><h2>Auteurs</h2><div id="authors"></div><h2>Mesures du radar</h2><div id="metrics"></div></aside>
<section class="content"><section class="chart-frame"><section class="chart-box"><canvas id="radar"></canvas></section><select class="chart-download" data-canvas="radar" aria-label="Télécharger le radar"><option value="png">PNG</option><option value="svg">SVG</option></select></section><p id="radar-selection" class="radar-selection"></p><div class="radar-tools"><button id="corpus-profile" type="button">Limites</button><button id="author-profile" type="button">Auteurs</button><button id="author-limits" type="button" hidden>Limites auteurs</button><button id="works-profile" type="button" hidden>Œuvres</button></div><section class="surface-box chart-frame"><h2>Couverture stylistique <button id="coverage-help-button" class="help" type="button" aria-label="Afficher l’explication">?</button></h2><p id="coverage-help" class="help-text" hidden></p><canvas id="surfaces"></canvas><select class="chart-download" data-canvas="surfaces" aria-label="Télécharger la couverture stylistique"><option value="png">PNG</option><option value="svg">SVG</option></select></section><section class="evolution-box"><div id="evolution-charts"></div></section><div id="tables"></div></section>
</main><footer id="status">Chargement…</footer><script src="app.js"></script></body>
</html>
