<body><header><h1 id="site-name">Site Unshiter</h1><p id="site-description"></p></header>
<main><aside><details id="authors-panel" open><summary>Auteurs</summary><div id="authors"></div></details><h2>Mesures du radar</h2><div id="metrics"></div><div id="metric-note" class="axis-help" hidden><button id="metric-note-close" type="button" aria-label="Fermer">×</button><div id="metric-note-text"></div></div></aside>
<section class="content"><section class="chart-frame"><section class="chart-box"><canvas id="radar"></canvas></section><select class="chart-download" data-canvas="radar" aria-label="Télécharger le radar"><option value="png">PNG</option><option value="svg">SVG</option></select></section><div id="radar-legend" class="radar-legend"></div><div class="radar-tools"><button id="corpus-profile" type="button">Limites</button><button id="author-profile" type="button">Auteurs</button><button id="author-limits" type="button" hidden>Limites auteurs</button><button id="works-profile" type="button" hidden>Œuvres</button></div><section class="surface-box chart-frame"><h2>Couverture stylistique <button class="metric-help help" data-note-id="29" type="button" aria-label="Afficher l’explication">?</button></h2><canvas id="surfaces"></canvas><select class="chart-download" data-canvas="surfaces" aria-label="Télécharger la couverture stylistique"><option value="png">PNG</option><option value="svg">SVG</option></select></section><section class="distance-box chart-frame"><h2>Proximité stylistique</h2><canvas id="distances"></canvas><select class="chart-download" data-canvas="distances" aria-label="Télécharger la proximité stylistique"><option value="png">PNG</option><option value="svg">SVG</option></select></section><section class="evolution-box"><div id="evolution-charts"></div></section><div id="tables"></div></section>
